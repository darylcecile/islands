name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:core
      - run: bun run build
      - run: bun run typecheck
      - run: bun test
      - run: bun run examples
      - run: node examples/node/main.mjs
      - run: go -C sdk/go test ./...
      - run: go -C examples/go run . ../..
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install ./sdk/python
      - run: .venv/bin/python examples/python/main.py
