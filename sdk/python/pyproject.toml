[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "islands-runtime"
version = "0.1.0"
description = "Native asyncio embedding SDK for the Islands portable WASM extension runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["wasmtime==50.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
